name: MiraSmile (APK Android)

on:
  push:
    paths:
      - 'mirasmile/**'
      - '.github/workflows/mirasmile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirasmile
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mirasmile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk MiraSmile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiraSmile
          path: mirasmile/MiraSmile.apk
      - name: Publier l'APK (lien de téléchargement fixe)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mirasmile-latest
          name: MiraSmile (dernière version)
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            Appli MiraSmile pour Android (Samsung S22).
            Télécharge **MiraSmile.apk** depuis le téléphone, ouvre-le et autorise l'installation.
            Version ${{ github.run_number }} – commit ${{ github.sha }}
          files: mirasmile/MiraSmile.apk
