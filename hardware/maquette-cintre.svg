<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="sans-serif" font-size="12">
  <!-- Échelle : 1 mm = 1,5 px. Vue de dessus, le coureur est en bas. Maquette indicative, pas un plan. -->
  <rect width="700" height="330" fill="#fff"/>
  <text x="350" y="20" text-anchor="middle" font-size="14" font-weight="bold">Cintre route 42 cm, vue de dessus (1 mm = 1,5 px)</text>
  <!-- cintre -->
  <line x1="35" y1="250" x2="665" y2="250" stroke="#444" stroke-width="14" stroke-linecap="round"/>
  <text x="35" y="285" font-size="11" fill="#444">42 cm</text>
  <!-- potence -->
  <rect x="320" y="240" width="60" height="34" fill="#888"/><text x="350" y="297" text-anchor="middle" fill="#444" font-size="11">potence</text>
  <!-- GPS -->
  <rect x="320" y="85" width="60" height="120" rx="6" fill="#ddd" stroke="#333"/>
  <text x="350" y="140" text-anchor="middle">GPS</text><text x="350" y="156" text-anchor="middle" font-size="10">6 × 9,5 cm</text>
  <line x1="350" y1="205" x2="350" y2="240" stroke="#333" stroke-width="3"/>
  <!-- Boîtier retenu : écran 2,7" -->
  <rect x="405" y="150" width="128" height="90" rx="6" fill="#bfe3c0" stroke="#1a7f37" stroke-width="2"/>
  <rect x="418" y="162" width="94" height="64" fill="#fff" stroke="#1a7f37"/>
  <text x="465" y="198" text-anchor="middle" font-weight="bold">2,7"</text>
  <text x="465" y="145" text-anchor="middle" fill="#1a7f37" font-weight="bold">Boîtier ~8,5 × 6 cm</text>
  <!-- Écran 4,4" -->
  <rect x="405" y="125" width="173" height="115" rx="6" fill="none" stroke="#c0392b" stroke-dasharray="5 4" stroke-width="2"/>
  <text x="590" y="110" text-anchor="middle" fill="#c0392b" font-size="11">4,4" : boîtier ~11,5 × 8 cm</text>
  <text x="590" y="124" text-anchor="middle" fill="#c0392b" font-size="11">(trop large : mord sur la courbe)</text>
  <!-- zone plate -->
  <line x1="395" y1="318" x2="575" y2="318" stroke="#666"/><text x="485" y="314" text-anchor="middle" font-size="10" fill="#666">partie plate utile ~12 cm</text>
</svg>
